<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Hogwarts Sorting Hat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>The Sorting Hat</h1>
    <p>Enter your name to discover your Hogwarts house.</p>

    <input type="text" id="nameInput" placeholder="e.g. Benjamin">
    <button id="sortBtn">Sort Me!</button>

    <p id="resultText"></p>
    <p id="houseDescription"></p>
  </div>

  <script src="script.js"></script>
</body>

</html>
