<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Design</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 2.5rem;
      color: #0b3d91;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .card {
        background: #dfeeff;
        padding: 20px;
      }

      h1 {
        font-size: 1.8rem;
        color: #003366;
      }

      p {
        font-size: 0.95rem;
        color: #123;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Responsive Design Example</h1>
      <p>
        This page looks different on mobile and desktop screens. On a larger
        screen, the card is brighter and the text is larger. On a smaller
        screen, the spacing and colors change to fit mobile devices better.
      </p>
    </div>
  </div>
</body>

</html>
