<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Styling Practice</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: blue;
    }

    p {
      color: blue;
    }

    ul {
      list-style-position: inside;
      padding: 0;
    }

    li {
      color: blue;
      font-weight: bold;
      margin: 8px 0;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>My Practice Page</h1>
    <p>Ask AI to help with at least one of these changes.</p>

    <ul>
      <li>Center the content</li>
      <li>Make the text blue</li>
      <li>Bold the list items</li>
    </ul>
  </div>
</body>

</html>
